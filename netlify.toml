# =========================================================
# Netlify settings for the Danko site
# - publish = "."  : the website files are in the main folder
# - functions      : our server code (Yoco payment) lives in netlify/functions
# - included_files : lets the payment function read the product prices
#                    from js/script.js (so prices are only ever edited once)
# =========================================================
[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  included_files = ["js/script.js"]
